paths:
  raw: data/raw
  extracted: data/extracted
  aligned: data/aligned
  annotation: data/annotation
  processed: data/processed
  splits: data/splits
  results: results

languages:
  included: [en, si]
  excluded: [ta]

extraction:
  embedded_text_first: true
  preserve_page_boundaries: true
  unicode_normalization: NFC
  ocr_fallback: true
  ocr_languages:
    en: eng
    si: sin
  minimum_non_whitespace_characters_per_page: 40
  maximum_replacement_character_ratio: 0.001
  verification_default: pending_review
  repeated_boundary_line_minimum_fraction: 0.60
  repeated_boundary_line_minimum_pages: 3
  ocr_dpi: 300
  tesseract_executable: 'C:/Program Files/Tesseract-OCR/tesseract.exe'
  tessdata_directory: resources/tessdata

alignment:
  method: exact_unique_structural_match
  use_page_number_as_alignment_evidence: false
  default_manual_review_status: pending_review
  document_pairs:
    - document_type: constitution
      english_document_id: constitution_en_2023_consolidated
      sinhala_document_id: constitution_si_2023_consolidated
    - document_type: penal_code
      english_document_id: penal_code_en_consolidated_2006
      sinhala_document_id: penal_code_si_scan
